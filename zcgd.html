<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>ZCGD 设备分析大屏</title>
  <style>
    :root{--panel:rgba(9,25,46,.84);--line:rgba(117,181,255,.18);--text:#ebf5ff;--muted:#8eadd1;--cyan:#5be7ff;--green:#68ffa8;--amber:#ffd36a;--red:#ff7f9f;--shadow:0 24px 60px rgba(0,0,0,.3)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 8% 0,rgba(91,231,255,.12),transparent 27%),radial-gradient(circle at 95% 12%,rgba(104,255,168,.08),transparent 22%),linear-gradient(135deg,#030812,#07111f 45%,#081a31);overflow-x:hidden}
    .screen{width:min(1600px,calc(100vw - 40px));margin:auto;padding:24px 0 36px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 28px;margin-bottom:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(110deg,rgba(91,231,255,.08),transparent 35%),rgba(7,20,37,.84);box-shadow:var(--shadow)}
    h1{margin:0;font-size:30px;font-weight:700}.eyebrow{margin:0 0 7px;color:var(--cyan);font-size:11px;letter-spacing:2px}.title p{margin:7px 0 0;color:var(--muted);font-size:13px}.refresh{padding:10px 16px;border:1px solid rgba(91,231,255,.32);border-radius:7px;color:var(--text);background:rgba(91,231,255,.09);font:inherit;cursor:pointer}.refresh:hover{background:rgba(91,231,255,.17)}.refresh:disabled{opacity:.6;cursor:wait}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.summary-item{padding:15px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.summary-item span{display:block;color:var(--muted);font-size:12px}.summary-item strong{display:block;margin-top:8px;font-size:24px}.summary-item strong.online{color:var(--green)}.summary-item strong.offline{color:var(--red)}
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}.panel{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,rgba(10,34,63,.92),var(--panel));box-shadow:var(--shadow)}.sidebar{position:sticky;top:16px;max-height:calc(100vh - 32px);padding:18px;overflow:hidden}.panel-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.panel-heading h2,.content-head h2{margin:0;font-size:16px;font-weight:600}.panel-heading small,.subtle{color:var(--muted);font-size:11px}.nav{display:grid;gap:7px;margin-top:14px;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px;scrollbar-color:rgba(91,231,255,.35) transparent}.nav-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:10px 12px;border:1px solid rgba(117,181,255,.1);border-radius:7px;background:rgba(8,24,44,.65);color:var(--text);text-align:left;font:inherit;cursor:pointer}.nav-item:hover,.nav-item.active{border-color:rgba(91,231,255,.42);background:rgba(91,231,255,.1)}.nav-item strong{font-size:13px;font-weight:600}.nav-status{flex:none;color:var(--muted);font-size:11px}.nav-status::before{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#74869c;content:""}.nav-status.online::before{background:var(--green)}.nav-status.offline::before{background:var(--red)}.nav-status.loading::before{background:var(--amber)}
    .content{min-height:520px;padding:22px}.content-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.content-title strong{display:block;margin-top:8px;font-size:26px}.content-title small{display:block;margin-top:6px;color:var(--muted)}.status-row{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:10px;margin-bottom:18px;padding:12px;border:1px solid rgba(117,181,255,.1);border-radius:8px;background:rgba(7,24,44,.5)}.status-card span{display:block;color:var(--muted);font-size:11px}.status-card strong{display:block;margin-top:6px;font-size:16px}.status-card strong.online{color:var(--green)}.status-card strong.offline{color:var(--red)}
    .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric-card{min-width:0;min-height:112px;padding:14px;border:1px solid rgba(117,181,255,.13);border-radius:8px;background:linear-gradient(155deg,rgba(91,231,255,.045),transparent 55%),rgba(7,24,44,.6)}.metric-label{min-height:32px;color:var(--muted);font-size:12px;line-height:1.4}.metric-value{margin-top:9px;color:#fff;font-size:22px;font-weight:700;overflow-wrap:anywhere}.metric-unit{margin-top:4px;color:#9edfff;font-size:11px}.empty-state{grid-column:1/-1;padding:36px 16px;border:1px dashed rgba(117,181,255,.2);border-radius:8px;color:var(--muted);text-align:center;line-height:1.8}.error-note{margin-top:14px;color:#ffb3c4;font-size:12px;line-height:1.6}
    @media(max-width:1150px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.nav{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none}.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:720px){.screen{width:calc(100vw - 20px);padding-top:10px}.topbar{align-items:flex-start;padding:16px}.topbar h1{font-size:23px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.summary-item{padding:12px}.summary-item strong{font-size:20px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:15px}.content-head{flex-direction:column}.status-row{grid-template-columns:1fr 1fr}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-card{padding:11px}.metric-value{font-size:19px}}
    @media(max-width:390px){.nav,.metric-grid{grid-template-columns:1fr}.refresh{padding:8px 10px}}
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar"><div class="title"><p class="eyebrow">ZCGD · PRODUCTION MONITOR</p><h1>设备分析大屏</h1><p>生产设备实时数据与运行状态</p></div><button class="refresh" id="refreshButton" type="button">刷新数据</button></header>
    <section class="summary" aria-label="设备运行概览">
      <div class="summary-item"><span>设备总数</span><strong id="deviceCount">0</strong></div><div class="summary-item"><span>在线设备</span><strong class="online" id="onlineCount">0</strong></div><div class="summary-item"><span>离线设备</span><strong class="offline" id="offlineCount">0</strong></div><div class="summary-item"><span>最近刷新</span><strong id="refreshTime" style="font-size:15px">等待加载</strong></div>
    </section>
    <main class="layout">
      <aside class="panel sidebar"><div class="panel-heading"><h2>设备目录</h2></div><nav class="nav" id="deviceNav" aria-label="设备目录"></nav></aside>
      <section class="panel content"><div class="content-head"><div class="content-title"><h2>设备数据</h2><strong id="deviceTitle">加载中</strong><small id="deviceType">生产设备</small></div><span class="subtle" id="lastUpdated">等待数据</span></div>
        <div class="status-row"><div class="status-card"><span>最新上传时间</span><strong id="uploadTime">加载中</strong></div><div class="status-card"><span>设备状态</span><strong id="systemStatus">正在连接</strong></div></div>
        <div class="metric-grid" id="metricGrid"><div class="empty-state">正在读取设备数据</div></div><div class="error-note" id="errorNote" hidden></div>
      </section>
    </main>
  </div>
  <script>
    const API_KEY = "Dz8GA5mBMGIAUF5SaMD2HsC7Rd5arrMh";
    const BASE = "https://shurui.online-office.net/openapi/v1/app/5a65ffd3860a6444fc850ea0/entry/";
    const INJECTION_MODEL_1 = [
      "上一模周期时间（s）","上3位置（mm）","上4位置（mm）","上5温度（℃）","上6压力（bar）","上8压力（bar）","上7比例（%）","射嘴温度（℃）","温度1（℃）","温度2（℃）","温度3（℃）","生产计数","生产目标"
    ];
    const INJECTION_MODEL_2 = [
      "产量","设备状态","实时周期","动作计时","输出压力","输出速度","输出背压","温度1(℃)","温度2(℃)","温度3(℃)","温度4(℃)","温度5(℃)","油温(℃)","上模周期","温度设定值1(℃)","温度设定值2(℃)","温度设定值3(℃)","温度设定值4(℃)","温度设定值5(℃)"
    ];
    const INJECTION_SPECS = [
      ["一号注塑机","5396141929bef5e4f76414d1",1],["二号注塑机","5c94d978a73dd6747cd8d064",1],["三号注塑机","5c9c1eb3de9581772f85b08b",1],["四号注塑机","55d505009e168c53fed1b97f",1],["五号注塑机","5f5b569322d08c0675d39e69",1],["六号注塑机","5111fe8168a0a3fe73e6b324",1],["七号注塑机","5422a3bc754d7cf8e5e0f5df",1],["八号注塑机","55f712ed187954d4c1bd18b1",1],["九号注塑机","56bd88e175b23e4cb3888db5",1],["十号注塑机","5d2c2fc6c451a7f6f3eb6e60",1],["十一号注塑机","50abe13c52e2f1d204acce0c",1],["十二号注塑机","546a3a590863501f99bb8522",1],["十三号注塑机","55b5eeed64d2a4a37a61b881",1],["十四号注塑机","5d521d43bed8f283cdc0f997",1],["十五号注塑机","539df8e73245bf63cb9d4851",1],["十六号注塑机","5ce7c5360b3c334fc7922005",1],["十七号注塑机","5d952023bd6b13a2a8ad0434",1],["十八号注塑机","5e3fe9e3c49a1f132056970d",1],["十九号注塑机","59a9e142ce18adf5523631f9",1],["二十号注塑机","5ad07445fbe186259ef94636",1],["二十一号注塑机","533a568de1b7f657a5ca79c8",2],["二十二号注塑机","5a19e0f00a2d06513910f8cc",2],["四十二号注塑机","546a2751f4561a9431145607",1],["四十三号注塑机","5a5e0915a72d4397e6813bd1",1],["四十四号注塑机","5aa2a7c85e7f6a8da264ed53",1],["四十五号注塑机","5f05162002c43abcd1214e25",1],["四十六号注塑机","58f9fc377492cde19accfefc",1],["四十七号注塑机","50204d83a83abb8e5728ea5a",1],["四十八号注塑机","5e8420ec13f203d13dd441ee",1],["四十九号注塑机","5c5b30dfe502673223727591",1],["五十号注塑机","5f33f5ce3340bb9feb57fa7d",1],["五十一号注塑机","5a8537d10ee64790d52299ae",1],["五十二号注塑机","527828e6109064e8374ec01a",1],["五十三号注塑机","5e4d57d6b94956acb8b0182b",1],["五十四号注塑机","59696382cbef88f02f82b25b",1]
    ];
    const CNC_SPECS = [
      ["1号精雕CNC","52c329517b56f7ed7cc1d4f0","精雕CNC",10,["X轴","Y轴","Z轴","实际进给P","实际转速S","装载刀具","累计运行时间","累计加工时间","累计次数"],["number","number","number","number","number","text","text","text","number"]],
      ["2号精雕CNC","5265e2abec310c409a5f1e3a","精雕CNC",10,["X轴","Y轴","Z轴","实际进给P","实际转速S","装载刀具","累计运行时间","累计加工时间","累计次数"],["number","number","number","number","number","text","text","text","number"]],
      ["3号精雕CNC","5c6c424e6b48860d8e0064ae","精雕CNC",10,["X轴","Y轴","Z轴","实际进给P","实际转速S","装载刀具","累计运行时间","累计加工时间","累计次数"],["number","number","number","number","number","text","text","text","number"]],
      ["1号大隈CNC","598a67aa27060435cbdaf7eb","大隈CNC",10,["X轴当前位置","Y轴当前位置","Z轴当前位置","X轴目标位置","Y轴目标位置","Z轴目标位置","X轴相对位置","Y轴相对位置","Z轴相对位置"],Array(9).fill("number")],
      ["2号大隈CNC","5121be36a25717adc7925049","大隈CNC",10,["X轴当前位置","Y轴当前位置","Z轴当前位置","X轴目标位置","Y轴目标位置","Z轴目标位置","X轴相对位置","Y轴相对位置","Z轴相对位置"],Array(9).fill("number")]
    ];
    const DEVICES = [
      ...INJECTION_SPECS.map(([name,entry,model])=>({name,type:`注塑机 · 型号${model}`,apiUrl:BASE+entry+"/data",timeKey:"N_1",fields:(model===1?INJECTION_MODEL_1:INJECTION_MODEL_2).map((label,index)=>({key:`N_${index+2}`,label,unit:"",type:"number"}))})),
      ...CNC_SPECS.map(([name,entry,type,timeKey,labels,types])=>({name,type,apiUrl:BASE+entry+"/data",timeKey:`N_${timeKey}`,fields:labels.map((label,index)=>({key:`N_${index+1}`,label,unit:"",type:types[index]}))}))
    ];
    const ONLINE_WINDOW_MS=30*60*1000, REQUEST_INTERVAL_MS=210;
    const state={active:0,records:new Map(),statuses:new Map(),errors:new Map(),inflight:new Map(),refreshing:false,lastRefresh:null};
    const $=id=>document.getElementById(id);
    function esc(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}
    function parseTime(value){if(!value)return null;const date=new Date(String(value).replace(/-/g,"/"));return Number.isNaN(date.getTime())?null:date;}
    function formatTime(value){const date=parseTime(value);if(!date)return value?String(value):"--";return new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(date);}
    function currentStatus(device,record){const uploadTime=parseTime(record?.[device.timeKey]);if(!uploadTime)return {text:"离线",className:"offline"};const online=Date.now()-uploadTime.getTime()<=ONLINE_WINDOW_MS;return {text:online?"在线":"离线",className:online?"online":"offline"};}
    function renderSummary(){const online=[...state.statuses.values()].filter(status=>status.className==="online").length;const offline=[...state.statuses.values()].filter(status=>status.className==="offline").length;$("deviceCount").textContent=DEVICES.length;$("onlineCount").textContent=online;$("offlineCount").textContent=offline;$("refreshTime").textContent=state.lastRefresh?formatTime(state.lastRefresh):"等待加载";}
    function renderNav(){const nav=$("deviceNav");nav.innerHTML=DEVICES.map((device,index)=>{const status=state.statuses.get(index)||{text:"待加载",className:""};return `<button class="nav-item ${index===state.active?"active":""}" type="button" data-index="${index}" aria-current="${index===state.active?"true":"false"}"><strong>${esc(device.name)}</strong><span class="nav-status ${status.className}">${status.text}</span></button>`}).join("");nav.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>{const index=Number(button.dataset.index);state.active=index;renderNav();renderDetail();loadDevice(DEVICES[index],index);}));}
    function formatValue(value,field){if(value===null||value===undefined||value==="")return "--";const number=Number(value);if(field.type==="number"&&!Number.isNaN(number))return Math.abs(number)>=1000?number.toLocaleString("zh-CN",{maximumFractionDigits:2}):number.toLocaleString("zh-CN",{maximumFractionDigits:3});return String(value);}
    function renderDetail(){const device=DEVICES[state.active],record=state.records.get(state.active),status=state.statuses.get(state.active)||{text:"待加载",className:""};$("deviceTitle").textContent=device.name;$("deviceType").textContent=device.type;$("uploadTime").textContent=record?formatTime(record[device.timeKey]):"暂无数据";const statusEl=$("systemStatus");statusEl.textContent=status.text;statusEl.className=status.className;$("lastUpdated").textContent=state.lastRefresh?`刷新于 ${formatTime(state.lastRefresh)}`:"等待数据";const error=$("errorNote");error.hidden=!state.errors.has(state.active);error.textContent=state.errors.get(state.active)||"";const grid=$("metricGrid");if(!record){grid.innerHTML=`<div class="empty-state">${state.errors.has(state.active)?"设备数据加载失败，请检查 API 权限、网络或浏览器跨域设置。":"正在加载设备数据"}</div>`;return;}grid.innerHTML=device.fields.map(field=>`<article class="metric-card"><div class="metric-label">${esc(field.label)}</div><div class="metric-value">${esc(formatValue(record[field.key],field))}</div><div class="metric-unit">${field.unit||"&nbsp;"}</div></article>`).join("");}
    let lastRequestAt=0,requestQueue=Promise.resolve();
    function scheduleRequest(request){const queued=requestQueue.then(async()=>{const wait=Math.max(0,REQUEST_INTERVAL_MS-(Date.now()-lastRequestAt));if(wait)await new Promise(resolve=>setTimeout(resolve,wait));lastRequestAt=Date.now();return request();});requestQueue=queued.catch(()=>{});return queued;}
    async function fetchLatest(device){const body={limit:1,skip:0,sort:{[device.timeKey]:"desc"}};const authHeaders=[{"Content-Type":"application/json","x-api-key":API_KEY},{"Content-Type":"application/json","api-key":API_KEY},{"Content-Type":"application/json","Authorization":`Bearer ${API_KEY}`}];let lastError;for(let attempt=0;attempt<authHeaders.length;attempt++){try{const response=await scheduleRequest(()=>fetch(device.apiUrl,{method:"POST",headers:authHeaders[attempt],body:JSON.stringify(body)}));if(response.status===429||response.status>=500){if(attempt<2){await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));continue;}}if(!response.ok)throw new Error(`HTTP ${response.status}`);const result=await response.json();const records=Array.isArray(result.data)?result.data:[];if(!records.length)throw new Error("接口返回为空");return records[0];}catch(error){lastError=error;if(error.message.startsWith("HTTP ")&&error.message!=="HTTP 429"&&!error.message.match(/^HTTP 5/))break;}}throw lastError||new Error("请求失败");}
    async function loadDevice(device,index){if(state.inflight.has(index))return state.inflight.get(index);state.statuses.set(index,{text:"加载中",className:"loading"});state.errors.delete(index);renderNav();renderSummary();if(index===state.active)renderDetail();const task=(async()=>{try{const record=await fetchLatest(device);state.records.set(index,record);state.statuses.set(index,currentStatus(device,record));}catch(error){state.statuses.set(index,{text:"离线",className:"offline"});state.errors.set(index,error.message);console.error(`${device.name} 数据加载失败`,error);}finally{state.inflight.delete(index);state.lastRefresh=new Date();renderNav();renderSummary();if(index===state.active)renderDetail();}})();state.inflight.set(index,task);return task;}
    async function refreshAll(){if(state.refreshing)return;state.refreshing=true;state.lastRefresh=new Date();$("refreshButton").disabled=true;$("refreshButton").textContent="刷新中";renderSummary();try{await Promise.all(DEVICES.map((device,index)=>loadDevice(device,index)));}finally{state.refreshing=false;$("refreshButton").disabled=false;$("refreshButton").textContent="刷新数据";renderSummary();}}
    $("deviceCount").textContent=DEVICES.length;$("refreshButton").addEventListener("click",refreshAll);renderNav();renderSummary();renderDetail();refreshAll();
  </script>
</body>
</html>
