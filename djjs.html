<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鼎杰金属设备大屏</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(9, 25, 46, 0.82);
      --panel-strong: rgba(10, 34, 63, 0.94);
      --line: rgba(117, 181, 255, 0.18);
      --text: #ebf5ff;
      --muted: #8eadd1;
      --accent: #5be7ff;
      --accent-2: #68ffa8;
      --accent-3: #ffd36a;
      --danger: #ff7f9f;
      --panel-edge: rgba(255, 255, 255, 0.05);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(91, 231, 255, 0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(104, 255, 168, 0.14), transparent 22%),
        linear-gradient(135deg, #030812 0%, #07111f 38%, #081a31 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
    }

    body::before {
      top: -18vh;
      right: -8vw;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(91, 231, 255, 0.18), transparent 62%);
      filter: blur(10px);
    }

    body::after {
      bottom: -20vh;
      left: -12vw;
      width: 42vw;
      height: 42vw;
      background: radial-gradient(circle, rgba(104, 255, 168, 0.12), transparent 64%);
      filter: blur(16px);
    }

    .screen {
      position: relative;
      z-index: 1;
      width: min(1680px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 20px 0 28px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel-strong), var(--panel));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 22%),
        linear-gradient(135deg, rgba(91, 231, 255, 0.06), transparent 24%);
      pointer-events: none;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      border: 1px solid var(--panel-edge);
      pointer-events: none;
    }

    .topbar {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 20px;
      padding: 24px 26px;
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(91, 231, 255, 0.08), transparent 30%),
        linear-gradient(180deg, rgba(7, 20, 37, 0.95), rgba(7, 20, 37, 0.74));
    }

    .topbar::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(91, 231, 255, 0.08), transparent),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 45%);
      pointer-events: none;
    }

    .topbar::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -26px;
      transform: translateX(-50%);
      width: 240px;
      height: 70px;
      background: radial-gradient(circle, rgba(91, 231, 255, 0.28), transparent 72%);
      filter: blur(12px);
      pointer-events: none;
    }

    .title-wrap h1 {
      position: relative;
      margin: 0;
      font-size: clamp(30px, 3.4vw, 44px);
      letter-spacing: 0.16em;
      font-weight: 700;
      text-shadow: 0 0 22px rgba(91, 231, 255, 0.18);
    }

    .title-wrap p {
      position: relative;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .refresh-tag {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-top: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(117, 181, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(220px, 1.35fr);
      gap: 12px;
      align-content: center;
    }

    .stat-card {
      position: relative;
      padding: 16px;
      border-radius: 18px;
      background: rgba(8, 28, 54, 0.75);
      border: 1px solid rgba(117, 181, 255, 0.18);
    }

    .stat-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .stat-card strong {
      display: block;
      font-size: 26px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      align-items: start;
    }

    .sidebar {
      padding: 20px;
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow: hidden;
    }

    .sidebar h2,
    .content-head h2 {
      position: relative;
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .sidebar small,
    .content-head small {
      color: var(--muted);
      font-size: 12px;
    }

    .nav {
      margin-top: 18px;
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      padding-right: 6px;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(91, 231, 255, 0.45) transparent;
    }

    .nav::-webkit-scrollbar {
      width: 8px;
    }

    .nav::-webkit-scrollbar-track {
      background: transparent;
    }

    .nav::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(91, 231, 255, 0.35);
    }

    .nav-item {
      position: relative;
      overflow: hidden;
      width: 100%;
      border: 1px solid rgba(117, 181, 255, 0.14);
      background:
        linear-gradient(180deg, rgba(14, 36, 64, 0.9), rgba(8, 24, 44, 0.78));
      border-radius: 20px;
      padding: 18px 16px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 12px 24px rgba(0, 0, 0, 0.16);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .nav-item:hover {
      transform: translateY(-3px);
      border-color: rgba(91, 231, 255, 0.36);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 18px 30px rgba(0, 0, 0, 0.22);
    }

    .nav-item.active {
      background:
        linear-gradient(135deg, rgba(91, 231, 255, 0.24), rgba(104, 255, 168, 0.14)),
        linear-gradient(180deg, rgba(13, 41, 68, 0.98), rgba(10, 34, 58, 0.9));
      border-color: rgba(91, 231, 255, 0.42);
      box-shadow:
        inset 0 0 0 1px rgba(91, 231, 255, 0.12),
        0 18px 32px rgba(5, 15, 31, 0.28);
    }

    .nav-item strong {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .nav-item em {
      display: block;
      font-style: normal;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
      letter-spacing: 0.08em;
    }

    .nav-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7f8fa6;
      box-shadow: 0 0 10px rgba(127, 143, 166, 0.4);
    }

    .nav-status.online::before {
      background: var(--accent-2);
      box-shadow: 0 0 12px rgba(104, 255, 168, 0.5);
    }

    .nav-status.offline::before {
      background: var(--danger);
      box-shadow: 0 0 12px rgba(255, 127, 159, 0.45);
    }

    .nav-status.loading::before {
      background: var(--accent-3);
      box-shadow: 0 0 12px rgba(255, 207, 90, 0.45);
    }

    .content {
      padding: 24px;
    }

    .content-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .content-title strong {
      display: block;
      font-size: clamp(28px, 2.7vw, 36px);
      line-height: 1.2;
      margin-top: 10px;
      text-shadow: 0 0 18px rgba(91, 231, 255, 0.12);
    }

    .content-meta {
      display: grid;
      gap: 14px;
      margin-bottom: 20px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .hero-card,
    .status-card {
      padding: 18px;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(91, 231, 255, 0.07), transparent 45%),
        rgba(7, 24, 44, 0.5);
      border: 1px solid rgba(117, 181, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .hero-card h3,
    .status-card h3 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .hero-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 14px;
    }

    .hero-card .status-main {
      display: block;
      margin-bottom: 10px;
      font-size: clamp(28px, 2.5vw, 36px);
      line-height: 1.2;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(91, 231, 255, 0.12);
    }

    .status-card .time {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status-card .sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-card {
      position: relative;
      overflow: hidden;
      padding: 18px 16px;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(12, 34, 61, 0.95), rgba(7, 24, 44, 0.82));
      border: 1px solid rgba(117, 181, 255, 0.14);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 14px 28px rgba(0, 0, 0, 0.16);
      min-height: 144px;
    }

    .metric-card.wide-compact {
      grid-column: span 2;
      min-height: 96px;
      padding-top: 14px;
      padding-bottom: 12px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      min-height: 34px;
      line-height: 1.45;
    }

    .metric-card.wide-compact .metric-label {
      min-height: auto;
    }

    .metric-value {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
      text-shadow: 0 0 20px rgba(91, 231, 255, 0.08);
    }

    .metric-card.wide-compact .metric-value {
      margin-top: 8px;
      font-size: 22px;
      line-height: 1.25;
    }

    .metric-unit {
      margin-top: 6px;
      color: #9edfff;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .empty-state {
      padding: 42px 20px;
      border-radius: 24px;
      border: 1px dashed rgba(117, 181, 255, 0.18);
      background:
        linear-gradient(135deg, rgba(91, 231, 255, 0.06), transparent 38%),
        rgba(7, 24, 44, 0.45);
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .subform-panel {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(91, 231, 255, 0.07), transparent 45%),
        rgba(7, 24, 44, 0.5);
      border: 1px solid rgba(117, 181, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .subform-panel.show {
      display: block;
    }

    .subform-panel h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.06em;
    }

    .subform-panel small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.7;
    }

    .subform-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .subform-item {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(117, 181, 255, 0.08);
    }

    .subform-item strong {
      display: block;
      margin-bottom: 10px;
      color: #c9efff;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .subform-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .subform-field {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(117, 181, 255, 0.06);
    }

    .subform-field span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .subform-field em {
      display: block;
      color: var(--text);
      font-style: normal;
      line-height: 1.65;
      word-break: break-word;
    }

    @media (max-width: 1360px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

      .nav {
        max-height: none;
        overflow: visible;
        padding-right: 0;
      }

      .metric-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 1024px) {
      .topbar,
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .stats,
      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .subform-fields {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .screen {
        width: min(100vw - 18px, 100%);
        padding-top: 12px;
      }

      .topbar,
      .content,
      .sidebar {
        padding: 18px;
      }

      .stats,
      .metric-grid {
        grid-template-columns: 1fr;
      }

      .metric-card.wide-compact {
        grid-column: span 1;
      }

      .content-head {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="panel topbar">

        <h1>鼎杰金属设备大屏</h1>

        <div class="metric-grid" id="metricGrid"></div>

          <small id="subformHint">子表字段按中文标题展示</small>
          <div id="subformContent"></div>
        </section>
      </section>
    </main>
  </div>

          { key: "N_5", label: "Y轴当前值", unit: "mm", type: "number" },
          { key: "N_6", label: "X轴程序值", unit: "mm", type: "number" },
          { key: "N_7", label: "X轴当前值", unit: "mm", type: "number" },
          { key: "N_3", label: "总孔数", unit: "步", type: "number" },
          { key: "N_8", label: "已加工", unit: "步", type: "number" }
        ]
      },
      {
        id: "plasma",
        name: "等离子切割机",
        typeLabel: "等离子切割",
        apiUrl: "https://shurui.online-office.net/openapi/v1/app/513bc19a25c7b90d9b8935b8/entry/56ca1916118a676e47c44867/data",
        timeKey: "Datetime",
        fields: [
          { key: "N_1", label: "割缝", unit: "mm", type: "number" },
          { key: "N_2", label: "运行时间", unit: "h:m:s", type: "text" },
          { key: "N_3", label: "切割时间", unit: "h:m:s", type: "text" },
          { key: "N_4", label: "切割距离", unit: "m", type: "number" },
          { key: "N_5", label: "穿孔数", unit: "个", type: "number" },
          { key: "N_6", label: "切割速度", unit: "mm/min", type: "number" },
          { key: "N_7", label: "文件名", unit: "", type: "text" },
          { key: "N_8", label: "运行状态", unit: "", type: "text" },
          { key: "N_9", label: "定长距离", unit: "mm", type: "number" },
          { key: "N_10", label: "手动方式", unit: "", type: "text" },
          { key: "N_11", label: "手动速度", unit: "mm/min", type: "number" },
          { key: "N_12", label: "当前速度", unit: "mm/min", type: "number" }
        ]
      },
      {
        id: "hardness",
        name: "硬度质检仪",
        typeLabel: "品质检测",
        apiUrl: "https://shurui.online-office.net/openapi/v1/app/513bc19a25c7b90d9b8935b8/entry/532d762b83b7094f6c03c536/data",
        timeKey: "N_3",
        subformKey: "N_4",
        subformTitle: "产品质检明细",
        subformAliases: {
          N_1: "报工单号",
          N_2: "计划单号",
          N_3: "上传时间",
          N_5: "产品编号",
          N_6: "产品名称",
          N_7: "测量值1",
          N_8: "测量值2",
          N_9: "测量值3",
          N_10: "测量值4",
          N_11: "测量值5",
          N_12: "平均值"
        },
        fields: [
          { key: "N_1", label: "报工单号", unit: "", type: "text", className: "wide-compact" },
          { key: "N_2", label: "计划单号", unit: "", type: "text", className: "wide-compact" }
        ]
      }
    ];

    const state = {
      activeDeviceId: DEVICES[0].id,
      records: new Map(),
      deviceStatus: new Map(),
      errors: new Map(),
      lastRefresh: null
    };

    const el = {
      deviceCount: document.getElementById("deviceCount"),
      onlineCount: document.getElementById("onlineCount"),
      offlineCount: document.getElementById("offlineCount"),
      focusName: document.getElementById("focusName"),
      lastRefreshLabel: document.getElementById("lastRefreshLabel"),
      deviceNav: document.getElementById("deviceNav"),
      deviceTitle: document.getElementById("deviceTitle"),
      detailType: document.getElementById("detailType"),
      heroLabel: document.getElementById("heroLabel"),
      heroStatus: document.getElementById("heroStatus"),
      heroDesc: document.getElementById("heroDesc"),
      uploadTime: document.getElementById("uploadTime"),
      statusText: document.getElementById("statusText"),
      metricGrid: document.getElementById("metricGrid"),
      subformPanel: document.getElementById("subformPanel"),
      subformTitle: document.getElementById("subformTitle"),
      subformHint: document.getElementById("subformHint"),
      subformContent: document.getElementById("subformContent")
    };

    el.deviceCount.textContent = String(DEVICES.length);

    function getDevice(deviceId) {
      return DEVICES.find(item => item.id === deviceId);
    }

    function formatValue(value, config) {
      if (value === null || value === undefined || value === "") return "--";
      if (config.type === "number") {
        const num = Number(value);
        if (Number.isNaN(num)) return String(value);
        return Math.abs(num) >= 1000
          ? num.toLocaleString("zh-CN", { maximumFractionDigits: 2 })
          : num.toLocaleString("zh-CN", { maximumFractionDigits: 3 });
      }
      return String(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatTime(value) {
      if (!value) return "--";
      const date = new Date(String(value).replace(/-/g, "/"));
      if (Number.isNaN(date.getTime())) return String(value);
      const parts = [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ];
      const time = [
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ];
      return parts.join("-") + " " + time.join(":");
    }

    function parseTime(value) {
      if (!value) return null;
      const date = new Date(String(value).replace(/-/g, "/"));
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function getStatusFromRecord(device, record) {
      const uploadTime = parseTime(record?.[device.timeKey]);
      if (!uploadTime) {
        return { text: "离线", className: "offline" };
      }

      const diffMs = Date.now() - uploadTime.getTime();
      const isOnline = diffMs <= ONLINE_WINDOW_MS;
      return {
        text: isOnline ? "在线" : "离线",
        className: isOnline ? "online" : "offline"
      };
    }

    function renderNav() {
      el.deviceNav.innerHTML = DEVICES.map(device => `
        <button class="nav-item ${device.id === state.activeDeviceId ? "active" : ""}" data-device-id="${device.id}" type="button">
          <strong>${device.name}</strong>
          <em>${device.typeLabel}</em>
          <span class="nav-status ${state.deviceStatus.get(device.id)?.className || ""}">${state.deviceStatus.get(device.id)?.text || "待加载"}</span>
        </button>
      `).join("");

      el.deviceNav.querySelectorAll(".nav-item").forEach(button => {
        button.addEventListener("click", () => {
          const { deviceId } = button.dataset;
          if (deviceId === state.activeDeviceId) return;
          state.activeDeviceId = deviceId;
          renderNav();
          renderSummaryStats();
          renderDetail();
        });
      });
    }

    function renderSummaryStats() {
      let online = 0;
      let offline = 0;

      DEVICES.forEach(device => {
        const status = state.deviceStatus.get(device.id);
        if (status?.className === "online") online += 1;
        if (status?.className === "offline") offline += 1;
      });

      el.onlineCount.textContent = String(online);
      el.offlineCount.textContent = String(offline);
      el.focusName.textContent = getDevice(state.activeDeviceId)?.name || "--";
      el.lastRefreshLabel.textContent = `最近刷新：${state.lastRefresh ? formatTime(state.lastRefresh) : "等待首次加载"}`;
    }

    function renderEmpty(message) {
      el.metricGrid.innerHTML = `<div class="empty-state">${message}</div>`;
    }

    function flattenObjectEntries(input, prefix = "") {
      if (!input || typeof input !== "object" || Array.isArray(input)) return [];
      return Object.entries(input).flatMap(([key, value]) => {
        const nextKey = prefix ? `${prefix}.${key}` : key;
        if (value && typeof value === "object" && !Array.isArray(value)) {
          return flattenObjectEntries(value, nextKey);
        }
        if (Array.isArray(value)) {
          return [[nextKey, value.map(item => typeof item === "object" ? JSON.stringify(item) : String(item)).join("，")]];
        }
        return [[nextKey, value]];
      });
    }

    function normalizeSubformRow(row) {
      if (!row || typeof row !== "object") return {};
      if (row.data && typeof row.data === "object" && !Array.isArray(row.data)) {
        return row.data;
      }
      return row;
    }

    function getFieldAlias(device, key) {
      if (device.subformAliases?.[key]) return device.subformAliases[key];
      const field = device.fields.find(item => item.key === key);
      if (field?.label) return field.label;
      if (key === device.timeKey) return "上传时间";
      return key;
    }

    function renderSubformValue(device, value) {
      const rows = Array.isArray(value) ? value : (value && typeof value === "object" ? [value] : []);
      if (!rows.length) {
        return '<div class="empty-state">暂无子表数据</div>';
      }

      const ignoredKeys = new Set([
        "id",
        "appId",
        "app_id",
        "entryId",
        "entry_id",
        "data_id",
        "_id",
        "creator",
        "updater",
        "createTime",
        "updateTime",
        "deleteTime",
        "flowState",
        "flowstate"
      ]);

      return `
        <div class="subform-list">
          ${rows.slice(0, 5).map((row, index) => {
            const entries = flattenObjectEntries(normalizeSubformRow(row)).filter(([key, itemValue]) => {
              const leafKey = key.split(".").pop();
              return !ignoredKeys.has(leafKey) && !/id$/i.test(leafKey) && itemValue !== null && itemValue !== undefined && itemValue !== "";
            });

            if (!entries.length) {
              return `
                <div class="subform-item">
                  <strong>明细 ${index + 1}</strong>
                  <div class="empty-state">无可展示字段</div>
                </div>
              `;
            }

            return `
              <div class="subform-item">
                <strong>明细 ${index + 1}</strong>
                <div class="subform-fields">
                  ${entries.slice(0, 12).map(([key, itemValue]) => {
                    const leafKey = key.split(".").pop();
                    return `
                      <div class="subform-field">
                        <span>${escapeHtml(getFieldAlias(device, leafKey))}</span>
                        <em>${escapeHtml(itemValue)}</em>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            `;
          }).join("")}
          ${rows.length > 5 ? `<div class="subform-item"><strong>补充说明</strong><div class="subform-field"><em>其余 ${rows.length - 5} 条明细未展开</em></div></div>` : ""}
        </div>
      `;
    }

    function renderSubformSection(device, record) {
      if (!device.subformKey) {
        el.subformPanel.classList.remove("show");
        el.subformContent.innerHTML = "";
        return;
      }

      el.subformTitle.textContent = device.subformTitle || "子表明细";
      el.subformHint.textContent = "子表字段按中文标题展示";
      el.subformContent.innerHTML = renderSubformValue(device, record?.[device.subformKey]);
      el.subformPanel.classList.add("show");
    }

    function renderDetail() {
      const device = getDevice(state.activeDeviceId);
      if (!device) return;

      const record = state.records.get(device.id);
      const status = state.deviceStatus.get(device.id) || { text: "待加载", className: "" };
      const error = state.errors.get(device.id);

      el.deviceTitle.textContent = device.name;
      el.detailType.textContent = device.typeLabel;
      el.heroLabel.textContent = "当前设备状态";
      el.heroStatus.textContent = status.text || "待加载";
      el.heroStatus.style.color = status.className === "online"
        ? "var(--accent-2)"
        : status.className === "offline"
          ? "var(--danger)"
          : "var(--accent-3)";
      el.heroDesc.textContent = error || device.heroText;
      el.uploadTime.textContent = record ? formatTime(record[device.timeKey]) : "加载中";
      el.statusText.textContent = `状态：${status.text}${state.lastRefresh ? ` · 全局刷新于 ${formatTime(state.lastRefresh)}` : ""}`;

      if (!record) {
        renderEmpty("当前设备暂无可展示数据。");
        renderSubformSection(device, null);
        return;
      }

      el.metricGrid.innerHTML = device.fields.map(field => `
        <article class="metric-card ${field.className || ""}">
          <div class="metric-label">${field.label}</div>
          <div class="metric-value">${escapeHtml(formatValue(record[field.key], field))}</div>
          <div class="metric-unit">${field.unit || ""}</div>
        </article>
      `).join("");

      renderSubformSection(device, record);
    }

    async function fetchLatestRecord(device) {
      const body = {
        limit: 1,
        skip: 0,
        sort: {
          [device.timeKey]: "desc"
        }
      };

      const attempts = [
        { headers: { "Content-Type": "application/json", "x-api-key": API_KEY } },
        { headers: { "Content-Type": "application/json", "api-key": API_KEY } },
        { headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` } }
      ];

      let lastError = null;

      for (const attempt of attempts) {
        try {
          const response = await fetch(device.apiUrl, {
            method: "POST",
            headers: attempt.headers,
            body: JSON.stringify(body)
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const result = await response.json();
          const list = Array.isArray(result.data) ? result.data : [];
          if (!list.length) {
            throw new Error("接口返回为空");
          }

          return list[0];
        } catch (error) {
          lastError = error.message;
        }
      }

      throw new Error(lastError || "请求失败");
    }

    async function loadDevice(device) {
      state.deviceStatus.set(device.id, { text: "加载中", className: "loading" });
      state.errors.delete(device.id);
      renderNav();
      renderSummaryStats();
      if (device.id === state.activeDeviceId) {
        renderDetail();
      }

      try {
        const record = await fetchLatestRecord(device);
        state.records.set(device.id, record);
        state.deviceStatus.set(device.id, getStatusFromRecord(device, record));
      } catch (error) {
        state.deviceStatus.set(device.id, { text: "离线", className: "offline" });
        state.errors.set(device.id, `${device.name} 数据加载失败，请检查接口地址、鉴权配置或浏览器跨域策略。`);
        console.error(`${device.name} 数据加载失败:`, error.message);
      }

      renderNav();
      renderSummaryStats();
      if (device.id === state.activeDeviceId) {
        renderDetail();
      }
    }

    async function refreshAll() {
      state.lastRefresh = new Date();
      renderSummaryStats();
      await Promise.all(DEVICES.map(device => loadDevice(device)));
    }

    renderNav();
    renderDetail();
    renderSummaryStats();
    refreshAll();
    setInterval(refreshAll, REFRESH_INTERVAL);
  </script>
</body>
</html>
