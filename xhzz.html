<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鑫合铸造设备分析大屏</title>
  <style>
    :root{--bg:#07111f;--panel:rgba(9,25,46,.82);--strong:rgba(10,34,63,.95);--line:rgba(117,181,255,.18);--text:#ebf5ff;--muted:#8eadd1;--cyan:#5be7ff;--green:#68ffa8;--yellow:#ffd36a;--red:#ff7f9f;--shadow:0 24px 60px rgba(0,0,0,.35)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at top left,rgba(91,231,255,.16),transparent 28%),radial-gradient(circle at top right,rgba(104,255,168,.14),transparent 22%),linear-gradient(135deg,#030812,#07111f 38%,#081a31);overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(14px);z-index:0}body:before{width:40vw;height:40vw;right:-8vw;top:-18vh;background:radial-gradient(circle,rgba(91,231,255,.18),transparent 62%)}body:after{width:42vw;height:42vw;left:-12vw;bottom:-20vh;background:radial-gradient(circle,rgba(104,255,168,.12),transparent 64%)}
    .screen{position:relative;z-index:1;width:min(1500px,calc(100vw - 32px));margin:auto;padding:24px 0 32px}.topbar,.panel{border:1px solid var(--line);background:linear-gradient(180deg,var(--strong),var(--panel));box-shadow:var(--shadow);backdrop-filter:blur(10px)}.topbar{position:relative;overflow:hidden;margin-bottom:20px;padding:25px 28px;border-radius:30px;text-align:center}.topbar:after{content:"";position:absolute;left:50%;top:-28px;transform:translateX(-50%);width:260px;height:75px;background:radial-gradient(circle,rgba(91,231,255,.3),transparent 72%);filter:blur(12px);pointer-events:none}.topbar h1{position:relative;margin:0;font-size:clamp(28px,3.2vw,42px);letter-spacing:.16em;text-shadow:0 0 22px rgba(91,231,255,.2)}.topbar p{position:relative;margin:8px 0 0;color:var(--muted);font-size:14px;letter-spacing:.2em;text-transform:uppercase}.toolbar{position:relative;display:flex;justify-content:flex-end;margin-top:18px}.toolbar button{border:1px solid rgba(91,231,255,.3);border-radius:999px;padding:9px 18px;color:var(--text);background:rgba(91,231,255,.1);cursor:pointer}.toolbar button:hover{background:rgba(91,231,255,.2)}
    .layout{display:grid;grid-template-columns:285px 1fr;gap:20px;align-items:start}.panel{position:relative;overflow:hidden;border-radius:24px}.sidebar{padding:20px;position:sticky;top:24px;max-height:calc(100vh - 48px)}h2{position:relative;margin:0;font-size:18px;letter-spacing:.08em;font-weight:600}.hint{color:var(--muted);font-size:12px}.nav{display:grid;gap:11px;margin-top:18px;max-height:calc(100vh - 155px);overflow-y:auto;padding-right:5px}.nav-item{width:100%;padding:15px 14px;border:1px solid rgba(117,181,255,.14);border-radius:18px;color:var(--text);text-align:left;background:linear-gradient(180deg,rgba(14,36,64,.9),rgba(8,24,44,.78));cursor:pointer;transition:.18s}.nav-item:hover,.nav-item.active{transform:translateY(-2px);border-color:rgba(91,231,255,.42)}.nav-item.active{background:linear-gradient(135deg,rgba(91,231,255,.24),rgba(104,255,168,.14)),rgba(10,34,58,.9)}.nav-item strong{display:block;font-size:16px;margin-bottom:8px}.nav-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:6px;background:#7f8fa6}.online .dot{background:var(--green);box-shadow:0 0 10px var(--green)}.offline .dot{background:var(--red)}.loading .dot{background:var(--yellow)}
    .content{padding:24px}.content-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.content-title strong{display:block;margin-top:9px;font-size:clamp(25px,2.4vw,34px);text-shadow:0 0 18px rgba(91,231,255,.12)}.last-refresh{color:var(--muted);font-size:12px;text-align:right}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.summary-card{padding:15px 16px;border:1px solid rgba(117,181,255,.14);border-radius:18px;background:rgba(7,24,44,.55)}.summary-card span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.summary-card strong{font-size:25px}.summary-card:nth-child(2) strong{color:var(--green)}.summary-card:nth-child(3) strong{color:var(--red)}.summary-card:nth-child(4) strong{color:var(--cyan)}.statusbar{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:12px}.status-card{padding:14px 16px;border-radius:18px;background:rgba(8,28,54,.75);border:1px solid rgba(117,181,255,.18)}.status-card span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.status-card strong{font-size:20px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}.metric-card{min-height:132px;padding:17px 16px;border-radius:20px;background:linear-gradient(180deg,rgba(12,34,61,.95),rgba(7,24,44,.82));border:1px solid rgba(117,181,255,.14);box-shadow:inset 0 1px rgba(255,255,255,.04);transition:.18s}.metric-card:hover{transform:translateY(-4px);border-color:rgba(91,231,255,.4)}.metric-label{color:var(--muted);font-size:12px;line-height:1.45;min-height:34px}.metric-value{margin-top:9px;font-size:25px;font-weight:700;color:#fff;word-break:break-word}.metric-unit{margin-top:5px;color:#9edfff;font-size:12px}.empty{grid-column:1/-1;padding:42px 20px;border:1px dashed rgba(117,181,255,.22);border-radius:22px;color:var(--muted);text-align:center;line-height:1.8}.error{color:#ffafbf}
    @media(max-width:1200px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.nav{max-height:none;grid-template-columns:repeat(3,minmax(0,1fr))}.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.summary,.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.screen{width:calc(100vw - 18px);padding-top:12px}.topbar,.content{padding:18px}.summary,.metric-grid,.nav,.statusbar{grid-template-columns:1fr}.content-head{flex-direction:column}.last-refresh{text-align:left}}
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <h1>设备分析大屏</h1><p>XHZZ EQUIPMENT ANALYTICS</p>
      <div class="toolbar"><button id="refreshAll" type="button">刷新全部设备</button></div>
    </header>
    <main class="layout">
      <aside class="panel sidebar"><h2>设备目录</h2><div class="hint">点击切换设备最新数据</div><div class="nav" id="deviceNav"></div></aside>
      <section class="panel content">
        <div class="content-head"><div class="content-title"><div class="hint">当前监测设备</div><strong id="deviceTitle">淋涂机系统</strong></div><div class="last-refresh">最后刷新<br><span id="lastRefresh">--</span></div></div>
        <div class="summary"><div class="summary-card"><span>监测设备</span><strong id="totalCount">7</strong></div><div class="summary-card"><span>在线设备</span><strong id="onlineCount">0</strong></div><div class="summary-card"><span>离线设备</span><strong id="offlineCount">0</strong></div><div class="summary-card"><span>当前字段</span><strong id="fieldCount">0</strong></div></div>
        <div class="statusbar"><div class="status-card"><span>最新上传时间</span><strong id="uploadTime">加载中</strong></div><div class="status-card"><span>设备状态</span><strong id="systemStatus">正在连接</strong></div></div>
        <div class="metric-grid" id="metricGrid"></div>
      </section>
    </main>
  </div>
  <script>
    const API_KEY = "8a6fzY7qK3PZ4CFcrhinSCPPtcDxt2sb";
    const TEMPLATES = {
      coating:{timeKey:"N_1",fields:[
        ["N_2","1#左空气压力","Mpa"],["N_3","1#右空气压力","Mpa"],["N_4","2#左空气压力","Mpa"],["N_5","2#右空气压力","Mpa"],["N_6","配比罐波美度","°Bé"],["N_7","供料罐波美度","°Bé"],["N_8","机架行当前速度","mm/s"],["N_9","机架行当前位置信息","mm"],["N_10","当前投料数量","PCS"],["N_11","配比罐进水量","L"],["N_12","配比罐水流量","L/s"],["N_13","供料罐进水量","L"],["N_14","供料罐水流量","L/s"]]},
      sand:{timeKey:"N_1",fields:[["N_2","清理电流设置","A"],["N_3","工作温度","℃"],["N_4","沙流量","g/min"],["N_5","树脂","g/min"],["N_6","17C","g/min"],["N_7","10C","g/min"]]},
      furnace:{timeKey:"N_1",fields:[["N_2","外循环水流温度","℃"],["N_3","外循环水流压力","Bar"],["N_4","内循环1水流温度","℃"],["N_5","内循环1水流压力","bar"],["N_6","外循环2水流温度","℃"],["N_7","外循环2水流压力","Bar"],["N_8","1#炉进水流量","m³/h"],["N_9","1#炉回水流量","m³/h"],["N_10","2#炉进水流量","m³/h"],["N_11","2#炉回水流量","m³/h"]]},
      cnc:{timeKey:"N_1",fields:[["N_2","X轴当前位置",""],["N_3","Y轴当前位置",""],["N_4","Z轴当前位置",""],["N_5","主轴速度","mm/min"],["N_6","程序剩余时间",""]]}
    };
    const DEVICES = [
      {id:"coating",name:"淋涂机系统",group:"涂装设备",template:"coating",apiUrl:"https://shurui.online-office.net/openapi/v1/app/51c8e976e9368bfbc23c56bf/entry/582e7013f135b7f0ef73fb6f/data"},
      {id:"sand-1",name:"混砂机1",group:"混砂设备",template:"sand",apiUrl:"https://shurui.online-office.net/openapi/v1/app/51c8e976e9368bfbc23c56bf/entry/5a4d6a2c987103d4e845073e/data"},
      {id:"sand-2",name:"混砂机2",group:"混砂设备",template:"sand",apiUrl:"https://shurui.online-office.net/openapi/v1/app/51c8e976e9368bfbc23c56bf/entry/552583d9221d4edbf6a2a7d4/data"},
      {id:"furnace",name:"熔炉",group:"热处理设备",template:"furnace",apiUrl:"https://shurui.online-office.net/openapi/v1/app/51c8e976e9368bfbc23c56bf/entry/50290168db08f24bd2ac8327/data"},
      {id:"cnc-1",name:"CNC加工机床1",group:"加工设备",template:"cnc",apiUrl:"https://shurui.online-office.net/openapi/v1/app/51c8e976e9368bfbc23c56bf/entry/5f72d5b7ec3b455e4ecb832c/data"},
      {id:"cnc-2",name:"CNC加工机床2",group:"加工设备",template:"cnc",apiUrl:"https://shurui.online-office.net/openapi/v1/app/51c8e976e9368bfbc23c56bf/entry/5f72d5b7ec3b455e4ecb832c/data"},
      {id:"cnc-3",name:"CNC加工机床3",group:"加工设备",template:"cnc",apiUrl:"https://shurui.online-office.net/openapi/v1/app/51c8e976e9368bfbc23c56bf/entry/59136d128c59cb4162db069d/data"}
    ];
    const state={activeId:DEVICES[0].id,records:new Map(),statuses:new Map(),requestNo:0};
    const $=id=>document.getElementById(id); const els={nav:$('deviceNav'),title:$('deviceTitle'),time:$('uploadTime'),status:$('systemStatus'),grid:$('metricGrid')};
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function toDate(value){if(!value)return null;const d=new Date(String(value).replace(/-/g,'/'));return Number.isNaN(d.getTime())?null:d}
    function formatTime(value){const d=toDate(value);return d?d.toLocaleString('zh-CN',{hour12:false}):'--'}
    function statusOf(device,record){const d=toDate(record?.[TEMPLATES[device.template].timeKey]);const online=d&&(Date.now()-d.getTime()<=30*60*1000);return {text:online?'在线':'离线',className:online?'online':'offline'};}
    function formatValue(value,type){if(value===null||value===undefined||value==='')return '--';if(type==='number'){const n=Number(value);if(!Number.isNaN(n))return Math.abs(n)>=1000?n.toLocaleString('zh-CN',{maximumFractionDigits:2}):n.toLocaleString('zh-CN',{maximumFractionDigits:3})}return escapeHtml(value)}
    function renderNav(){els.nav.innerHTML=DEVICES.map(d=>{const s=state.statuses.get(d.id)||{text:'待加载',className:'idle'};return `<button class="nav-item ${d.id===state.activeId?'active':''}" data-id="${d.id}" type="button"><strong>${escapeHtml(d.name)}</strong><span class="nav-meta"><span class="${s.className}"><i class="dot"></i>${s.text}</span><span>${escapeHtml(d.group)}</span></span></button>`}).join('');els.nav.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.activeId=b.dataset.id;renderNav();renderActive()})}
    function renderMetrics(device,record){const fields=TEMPLATES[device.template].fields; $('fieldCount').textContent=fields.length;els.grid.innerHTML=fields.map(([key,label,unit])=>`<article class="metric-card"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-value">${formatValue(record?.[key],'number')}</div><div class="metric-unit">${escapeHtml(unit)}</div></article>`).join('')}
    function renderEmpty(message,error=false){$('fieldCount').textContent='--';els.grid.innerHTML=`<div class="empty ${error?'error':''}">${escapeHtml(message)}</div>`}
    async function fetchLatest(device){const t=TEMPLATES[device.template];const body=JSON.stringify({limit:1,skip:0,sort:{[t.timeKey]:'desc'}});let last='请求失败';for(const headers of [{"Content-Type":"application/json","x-api-key":API_KEY},{"Content-Type":"application/json","api-key":API_KEY},{"Content-Type":"application/json","Authorization":`Bearer ${API_KEY}`}]){try{const r=await fetch(device.apiUrl,{method:'POST',headers,body});if(!r.ok)throw Error(`HTTP ${r.status}`);const json=await r.json();if(!Array.isArray(json.data)||!json.data[0])throw Error('接口返回为空');return json.data[0]}catch(e){last=e.message}}throw Error(last)}
    function updateSummary(){let on=0;state.statuses.forEach(s=>{if(s.className==='online')on++});$('totalCount').textContent=DEVICES.length;$('onlineCount').textContent=on;$('offlineCount').textContent=Math.max(0,state.statuses.size-on)}
    async function load(device,showActive=true){const no=++state.requestNo;state.statuses.set(device.id,{text:'加载中',className:'loading'});renderNav();if(showActive){els.title.textContent=device.name;els.status.textContent='刷新中';els.status.style.color='var(--yellow)';els.time.textContent='加载中';renderEmpty('正在加载设备最新数据...')};try{const record=await fetchLatest(device);if(no!==state.requestNo&&showActive)return;state.records.set(device.id,record);state.statuses.set(device.id,statusOf(device,record));if(showActive){renderMetrics(device,record);els.time.textContent=formatTime(record[TEMPLATES[device.template].timeKey]);els.status.textContent=state.statuses.get(device.id).text;els.status.style.color=state.statuses.get(device.id).className==='online'?'var(--green)':'var(--red)'} }catch(e){state.statuses.set(device.id,{text:'离线',className:'offline'});if(showActive){els.time.textContent='--';els.status.textContent='离线';els.status.style.color='var(--red)';renderEmpty(`${device.name} 数据加载失败，请检查接口或鉴权配置。`,true)}console.error(device.name,e.message)}finally{updateSummary();renderNav();$('lastRefresh').textContent=new Date().toLocaleString('zh-CN',{hour12:false})}}
    function renderActive(){const d=DEVICES.find(x=>x.id===state.activeId);if(!d)return;const record=state.records.get(d.id);if(record){els.title.textContent=d.name;renderMetrics(d,record);els.time.textContent=formatTime(record[TEMPLATES[d.template].timeKey]);const s=state.statuses.get(d.id);els.status.textContent=s?.text||'待加载';els.status.style.color=s?.className==='online'?'var(--green)':'var(--red)'}else load(d)}
    async function refreshAll(){ $('refreshAll').disabled=true;$('refreshAll').textContent='刷新中...';await Promise.all(DEVICES.map(d=>load(d,d.id===state.activeId)));$('refreshAll').disabled=false;$('refreshAll').textContent='刷新全部设备'}
    $('refreshAll').onclick=refreshAll;renderNav();refreshAll();
  </script>
</body>
</html>
